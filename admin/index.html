<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grabha — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

:root {
  --bg:      #0B0B0F;
  --surface: #111116;
  --card:    #15151B;
  --card-hov:#1B1B24;
  --border:  rgba(255,255,255,0.06);
  --border-s:rgba(255,255,255,0.035);
  --text:    #EDEDED;
  --text-2:  #A1A1AA;
  --text-3:  #52525B;
  --accent:  #E6C068;
  --success: #22C55E;
  --error:   #EF4444;
  --pending: #A1A1AA;
  --success-bg: rgba(34,197,94,0.10);
  --error-bg:   rgba(239,68,68,0.10);
  --pending-bg: rgba(161,161,170,0.10);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}

html { font-size: 14px }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── Login ─── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 40px 36px 36px;
  width: 320px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}
.login-mark {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 6px;
}
.login-mark img { height: 24px; border-radius: 5px }
.login-mark span { font-size: 15px; font-weight: 600; color: var(--text) }
.login-box p { color: var(--text-2); font-size: 13px; margin-bottom: 24px }
.login-box input {
  display: block;
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 7px;
  font: 13px/1.5 var(--font);
  margin-bottom: 8px;
  outline: none;
  transition: border-color 0.15s;
}
.login-box input:focus { border-color: rgba(255,255,255,0.22) }
.login-box input::placeholder { color: var(--text-3) }
.login-box button {
  display: block;
  width: 100%;
  background: #fff;
  border: none;
  color: #0a0a0a;
  padding: 10px;
  border-radius: 7px;
  font: 500 13px/1 var(--font);
  cursor: pointer;
  margin-top: 4px;
  transition: opacity 0.15s;
}
.login-box button:hover { opacity: 0.85 }
#login-error { color: var(--error); font-size: 12px; margin-top: 10px; min-height: 15px }

/* ─── Shell ─── */
#dashboard { display: none }

/* Fixed nav */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 52px;
  background: rgba(11,11,15,0.85);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-brand img { height: 20px; border-radius: 4px; opacity: 0.9 }
.nav-brand span { font-size: 14px; font-weight: 600; color: var(--text) }
.nav-divider {
  width: 1px; height: 16px;
  background: var(--border);
  margin: 0 10px;
}
.nav-page { font-size: 13px; color: var(--text-2) }
.nav-actions { display: flex; align-items: center; gap: 8px }
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  animation: blink 2.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.btn-sm {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-2);
  padding: 5px 12px;
  border-radius: 6px;
  font: 12px/1 var(--font);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.btn-sm:hover { border-color: rgba(255,255,255,0.18); color: var(--text) }

/* Page body */
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 56px;
}

/* ─── Section label ─── */
.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
}

/* ─── KPI grid ─── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.kpi-card {
  background: var(--card);
  padding: 20px 20px 16px;
  transition: background 0.15s;
}
.kpi-card:hover { background: var(--card-hov) }
.kpi-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
  color: var(--text-2);
  margin-bottom: 8px;
  text-transform: uppercase;
}
.kpi-value {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.3px;
  line-height: 1;
  margin-bottom: 4px;
}
.kpi-meta { font-size: 12px; color: var(--text-3) }
.kpi-spark { margin-top: 12px; height: 32px; opacity: 0.6 }
.kpi-card canvas { width: 100% !important; height: 32px !important }

/* ─── Chart row ─── */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

/* ─── Panel (shared card style) ─── */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.panel-title { font-size: 13px; font-weight: 600; color: var(--text) }
.panel-sub   { font-size: 12px; color: var(--text-3) }
.panel-full  { grid-column: 1 / -1 }

/* activity chart taller */
.panel-activity { margin-bottom: 16px }

/* ─── Filter bar ─── */
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 180px;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
  display: flex;
}
.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px 8px 32px;
  border-radius: 7px;
  font: 13px/1 var(--font);
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: rgba(255,255,255,0.2) }
.search-wrap input::placeholder { color: var(--text-3) }

/* Segmented filter */
.seg {
  display: inline-flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
}
.seg-btn {
  padding: 7px 13px;
  font: 12px/1 var(--font);
  color: var(--text-2);
  background: transparent;
  border: none;
  cursor: pointer;
  border-right: 1px solid var(--border);
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
}
.seg-btn:last-child { border-right: none }
.seg-btn:hover { color: var(--text); background: rgba(255,255,255,0.04) }
.seg-btn.active       { color: var(--text); background: rgba(255,255,255,0.08) }
.seg-btn.active.s-ok  { color: var(--success); background: var(--success-bg) }
.seg-btn.active.s-err { color: var(--error);   background: var(--error-bg) }
.seg-btn.active.s-pnd { color: var(--pending);  background: var(--pending-bg) }

/* ─── Table ─── */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; white-space: nowrap }

thead th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: left;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

tbody tr { cursor: pointer }
tbody tr:nth-child(even) td { background: rgba(255,255,255,0.014) }
tbody tr:hover td { background: rgba(255,255,255,0.06) !important; transition: background 0.12s ease }

tbody td {
  padding: 12px 14px;
  height: 44px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-s);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none }

/* Column widths — narrow secondary cols, title gets remaining space */
table { table-layout: fixed }
.c-id    { width: 40px;  color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums }
.c-ts    { width: 118px; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums }
.c-ip    { width: 106px; color: var(--text-2); font-size: 12px; font-family: ui-monospace, "SF Mono", monospace }
.c-loc   { width: 110px; color: var(--text); font-size: 13px }
.c-plat  { width: 96px;  color: var(--text); font-weight: 500 }
.c-fmt   { width: 80px;  color: var(--text-2); font-size: 12px }
.c-dev   { width: 72px;  color: var(--text-2); font-size: 12px }
.c-status{ width: 82px }
/* Title: fills remaining width, truncates with tooltip */
.c-title {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 0; /* forces ellipsis in table-layout:fixed */
}
.c-title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* Status badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px 2px 6px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}
.badge::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.badge.ok  { background: var(--success-bg); color: var(--success) }
.badge.err { background: var(--error-bg);   color: var(--error) }
.badge.pnd { background: var(--pending-bg); color: var(--pending) }

/* ─── Pager ─── */
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px;
  border-top: 1px solid var(--border);
}
.pager-info { font-size: 12px; color: var(--text-3) }
.pager-btns { display: flex; gap: 6px }
.pager-btns button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-2);
  padding: 5px 12px;
  border-radius: 6px;
  font: 12px/1 var(--font);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.pager-btns button:hover:not(:disabled) { border-color: rgba(255,255,255,0.2); color: var(--text) }
.pager-btns button:disabled { opacity: 0.28; cursor: default }

/* ─── Drawer ─── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
#overlay.on { display: block; animation: fi 0.18s ease }
@keyframes fi { from{opacity:0} to{opacity:1} }

#drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  background: var(--card);
  border-left: 1px solid var(--border);
  z-index: 201;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.32,0,0.15,1);
  display: flex;
  flex-direction: column;
}
#drawer.on { transform: none }

.dr-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
}
.dr-nav-title { font-size: 13px; font-weight: 550 }
.dr-close {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-2);
  width: 28px; height: 28px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
}
.dr-close:hover { border-color: rgba(255,255,255,0.2); color: var(--text) }

.dr-body { padding: 20px; flex: 1 }

.dr-status { margin-bottom: 12px }
.dr-heading {
  font-size: 14px;
  font-weight: 550;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 16px;
}
.dr-error {
  background: var(--error-bg);
  border: 1px solid rgba(239,68,68,0.18);
  border-radius: 7px;
  padding: 11px 13px;
  font-size: 12px;
  color: #f87171;
  line-height: 1.6;
  margin-bottom: 16px;
}
.dr-group { margin-bottom: 20px }
.dr-group-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 2px;
}
.dr-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-s);
}
.dr-row:last-child { border-bottom: none }
.dr-key { font-size: 12px; color: var(--text-2); flex-shrink: 0 }
.dr-val { font-size: 12px; color: var(--text); text-align: right; word-break: break-all }

/* read-only drawer — no footer actions */

/* ─── Stat bar list (platforms + countries) ─── */
.sbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-s);
}
.sbar-row:last-child { border-bottom: none }
.sbar-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; line-height: 1 }
.sbar-label {
  font-size: 12px;
  color: var(--text-2);
  width: 90px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sbar-track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.05);
  border-radius: 2px;
  overflow: hidden;
}
.sbar-fill {
  height: 100%;
  border-radius: 2px;
  background: #6366F1;
  transition: width 0.35s ease;
}
.sbar-count {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  text-align: right;
  width: 24px;
  flex-shrink: 0;
}

/* ─── Responsive ─── */
@media (max-width: 880px) {
  .kpi-grid    { grid-template-columns: repeat(2, 1fr) }
  .chart-row   { grid-template-columns: 1fr }
}
@media (max-width: 600px) {
  .page        { padding: 20px 14px 48px }
  .kpi-grid    { gap: 1px }
  .kpi-value   { font-size: 24px }
  #drawer      { width: 100% }
  .filter-row  { gap: 8px }
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-mark">
      <img src="/grabha-web/icons/icon-192.png" alt="">
      <span>Grabha</span>
    </div>
    <p>Admin access only</p>
    <input type="text"     id="un-input" placeholder="Username" autocomplete="username">
    <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-brand">
      <img src="/grabha-web/icons/icon-192.png" alt="">
      <span>Grabha</span>
      <div class="nav-divider"></div>
      <span class="nav-page">Activity</span>
    </div>
    <div class="nav-actions">
      <div class="live-dot" title="Server online"></div>
      <button class="btn-sm" id="refresh-btn">Refresh</button>
      <button class="btn-sm" id="logout-btn">Sign out</button>
    </div>
  </nav>

  <div class="page">

    <!-- KPI row -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total</div>
        <div class="kpi-value" id="s-total">—</div>
        <div class="kpi-meta" id="kpi-meta-total">All time</div>
        <div class="kpi-spark"><canvas id="spark-total"></canvas></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Successful</div>
        <div class="kpi-value" id="s-success" style="color:var(--success)">—</div>
        <div class="kpi-meta" id="kpi-meta-success">—</div>
        <div class="kpi-spark"><canvas id="spark-success"></canvas></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Errors</div>
        <div class="kpi-value" id="s-errors" style="color:var(--error)">—</div>
        <div class="kpi-meta" id="kpi-meta-errors">—</div>
        <div class="kpi-spark"><canvas id="spark-errors"></canvas></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Pending</div>
        <div class="kpi-value" id="s-pending" style="color:var(--text-2)">—</div>
        <div class="kpi-meta">In queue</div>
        <div class="kpi-spark"><canvas id="spark-pending"></canvas></div>
      </div>
    </div>

    <!-- Activity chart -->
    <div class="panel panel-activity">
      <div class="panel-head">
        <span class="panel-title">Activity</span>
        <span class="panel-sub">Downloads &amp; errors over time</span>
      </div>
      <canvas id="chart-activity" height="60"></canvas>
    </div>

    <!-- Analytics row — compact bar lists -->
    <div class="chart-row">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Platforms</span>
          <span class="panel-sub">By downloads</span>
        </div>
        <div id="platforms-list"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Countries</span>
          <span class="panel-sub">Top 5</span>
        </div>
        <div id="countries-list"></div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-row">
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input id="search-input" placeholder="Search title, IP, country…">
      </div>
      <div class="seg">
        <button class="seg-btn active"  data-filter="">All</button>
        <button class="seg-btn s-ok"   data-filter="success">Success</button>
        <button class="seg-btn s-err"  data-filter="error">Errors</button>
        <button class="seg-btn s-pnd"  data-filter="pending">Pending</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="c-id">#</th>
            <th class="c-ts">Time</th>
            <th class="c-status">Status</th>
            <th class="c-plat">Platform</th>
            <th class="c-loc">Location</th>
            <th class="c-fmt">Format</th>
            <th class="c-dev">Device</th>
            <th class="c-ip">IP</th>
            <th class="c-title">Title</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <div class="pager">
        <span class="pager-info" id="page-info">—</span>
        <div class="pager-btns">
          <button id="prev-btn">← Prev</button>
          <button id="next-btn">Next →</button>
        </div>
      </div>
    </div>

  </div><!-- /page -->
</div><!-- /dashboard -->

<!-- Drawer -->
<div id="overlay"></div>
<div id="drawer">
  <div class="dr-nav">
    <span class="dr-nav-title">Download details</span>
    <button class="dr-close" id="drawer-close">✕</button>
  </div>
  <div class="dr-body" id="drawer-body"></div>
</div>

<script>
// ── State ──
let API_BASE = '', token = '', currentPage = 1, totalPages = 1;
let apiReady = false, activeFilter = '', searchTimer = null;
let chartActivity = null;
let sparks = {};

const TOOLTIP = {
  backgroundColor: '#1A1A23',
  borderColor: 'rgba(255,255,255,0.08)',
  borderWidth: 1,
  titleColor: '#EDEDED',
  bodyColor: '#A1A1AA',
  padding: 10,
  cornerRadius: 6,
  displayColors: false,
};

// ── Bootstrap ──
(async () => {
  try {
    const r = await fetch('https://raw.githubusercontent.com/sreeharimv/grabha-web/main/tunnel-url.txt?t=' + Date.now(), { cache:'no-store' });
    const url = (await r.text()).trim();
    if (url) {
      const probe = await fetch(`${url}/health`, { cache:'no-store' });
      if ((await probe.json()).status === 'ok') { API_BASE = url; apiReady = true; }
    }
  } catch {}
  if (!apiReady) el('login-error').textContent = 'Cannot reach server — tunnel may be restarting.';
  const saved = localStorage.getItem('grabha_admin_token');
  if (saved && apiReady) { token = saved; showDash(); loadData(); }
})();

function el(id) { return document.getElementById(id) }

// ── Login ──
el('login-btn').addEventListener('click', login);
el('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') login() });

async function login() {
  const err = el('login-error');
  err.textContent = '';
  if (!apiReady) { err.textContent = 'Connecting to server…'; return; }
  try {
    const res = await fetch(`${API_BASE}/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: el('un-input').value, password: el('pw-input').value })
    });
    const d = await res.json();
    if (!res.ok) { err.textContent = d.error || 'Login failed'; return; }
    token = d.token;
    localStorage.setItem('grabha_admin_token', token);
    showDash(); loadData();
  } catch(e) { err.textContent = 'Could not reach server: ' + e.message }
}

el('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('grabha_admin_token');
  token = ''; currentPage = 1; activeFilter = '';
  el('dashboard').style.display = 'none';
  el('login-screen').style.display = 'flex';
  el('pw-input').value = '';
});

function showDash() {
  el('login-screen').style.display = 'none';
  el('dashboard').style.display = 'block';
}

// ── Controls ──
el('refresh-btn').addEventListener('click', () => { currentPage = 1; loadData() });

document.querySelectorAll('.seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    currentPage = 1; loadData();
  });
});

el('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; loadData() }, 300);
});

el('prev-btn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadData() } });
el('next-btn').addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; loadData() } });

// ── Data ──
async function loadData() {
  const q = el('search-input').value.trim();
  const params = new URLSearchParams({ page: currentPage });
  if (q) params.set('q', q);
  if (activeFilter) params.set('status', activeFilter);

  try {
    const res = await fetch(`${API_BASE}/admin/data?${params}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) {
      localStorage.removeItem('grabha_admin_token'); token = '';
      el('dashboard').style.display = 'none';
      el('login-screen').style.display = 'flex';
      return;
    }
    const d = await res.json();
    renderStats(d.stats);
    renderCharts(d);
    renderRows(d.rows);
    totalPages = d.pages;
    el('page-info').textContent = `${d.total} records · page ${d.page} of ${d.pages}`;
    el('prev-btn').disabled = d.page <= 1;
    el('next-btn').disabled = d.page >= d.pages;
  } catch(e) { console.error(e) }
}

// ── Stats ──
function renderStats(s) {
  const total = s.total ?? 0, succ = s.success ?? 0, err = s.errors ?? 0, pend = s.pending ?? 0;
  el('s-total').textContent   = total;
  el('s-success').textContent = succ;
  el('s-errors').textContent  = err;
  el('s-pending').textContent = pend;

  const sr = total ? Math.round(succ / total * 100) : 0;
  const er = total ? Math.round(err  / total * 100) : 0;
  el('kpi-meta-total').textContent   = 'All time';
  el('kpi-meta-success').textContent = sr + '% success rate';
  el('kpi-meta-errors').textContent  = er + '% error rate';

  spark('spark-total',   genTrend(total,  12), '#8B8B99');
  spark('spark-success', genTrend(succ,   12), '#22C55E');
  spark('spark-errors',  genTrend(err,    12), '#EF4444');
  spark('spark-pending', genTrend(pend,   12), '#8B8B99');
}

function genTrend(peak, n) {
  return Array.from({ length: n }, (_, i) => {
    const base = Math.max(0, Math.round(peak * (i + 1) / n));
    return base + Math.round((Math.random() - 0.5) * peak * 0.2);
  });
}

function spark(id, data, color) {
  if (sparks[id]) { sparks[id].destroy(); delete sparks[id] }
  const canvas = el(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 36);
  g.addColorStop(0, color + '28'); g.addColorStop(1, color + '00');
  sparks[id] = new Chart(ctx, {
    type: 'line',
    data: { labels: data.map(() => ''), datasets: [{ data, borderColor: color, borderWidth: 1.5, fill: true, backgroundColor: g, tension: 0.45, pointRadius: 0 }] },
    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false, min: 0 } } }
  });
}

// ── Charts ──
function renderCharts(d) {
  buildActivity(d.rows);
  buildPlatforms(d.top_platforms);
  buildCountries(d.top_countries);
}

function buildActivity(rows) {
  const byDay = {};
  rows.forEach(r => {
    const day = (r.timestamp || '').slice(0, 10);
    if (!day) return;
    if (!byDay[day]) byDay[day] = { dl: 0, err: 0 };
    byDay[day].dl++;
    if (r.status === 'error') byDay[day].err++;
  });
  const labels = Object.keys(byDay).sort();
  const dl  = labels.map(l => byDay[l].dl);
  const err = labels.map(l => byDay[l].err);

  if (chartActivity) chartActivity.destroy();
  const ctx = el('chart-activity').getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 200);
  g.addColorStop(0, '#818CF830'); g.addColorStop(1, '#818CF800');

  chartActivity = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.length ? labels : ['—'],
      datasets: [
        { label: 'Downloads', data: dl,  borderColor: '#818CF8', backgroundColor: g,             fill: true,  tension: 0.4, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, pointBackgroundColor: '#818CF8', pointBorderWidth: 0 },
        { label: 'Errors',    data: err, borderColor: '#EF4444', backgroundColor: 'transparent', fill: false, tension: 0.4, borderWidth: 2,   pointRadius: 0, pointHoverRadius: 4, pointBackgroundColor: '#EF4444', pointBorderWidth: 0 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          align: 'end',
          labels: { color: '#A1A1AA', boxWidth: 8, usePointStyle: true, pointStyle: 'circle', padding: 20, font: { size: 12 } }
        },
        tooltip: TOOLTIP
      },
      scales: {
        x: { ticks: { color: '#52525B', font: { size: 11 }, maxRotation: 0 }, grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false } },
        y: { ticks: { color: '#52525B', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true, border: { display: false } }
      }
    }
  });
}

const PLAT_ICON = { youtube:'▶', instagram:'📷', twitter:'🐦', tiktok:'♪', facebook:'f', vimeo:'V', twitch:'◈', reddit:'◉', soundcloud:'☁', default:'○' };
const FLAG = { 'United States':'🇺🇸','India':'🇮🇳','United Kingdom':'🇬🇧','Germany':'🇩🇪','France':'🇫🇷','Canada':'🇨🇦','Australia':'🇦🇺','Brazil':'🇧🇷','Japan':'🇯🇵','China':'🇨🇳','Netherlands':'🇳🇱','Singapore':'🇸🇬','UAE':'🇦🇪' };

function buildStatBars(containerId, items, labelKey, iconFn) {
  const el_ = el(containerId);
  if (!items?.length) { el_.innerHTML = '<p style="color:var(--text-3);font-size:12px;padding:6px 0">No data</p>'; return; }
  const maxN = items[0].n || 1;
  el_.innerHTML = items.slice(0, 6).map(d => {
    const label = d[labelKey] || 'Unknown';
    const pct   = Math.round(d.n / maxN * 100);
    const icon  = iconFn(label);
    return `<div class="sbar-row">
      <span class="sbar-icon">${icon}</span>
      <span class="sbar-label" title="${label}">${label}</span>
      <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%"></div></div>
      <span class="sbar-count">${d.n}</span>
    </div>`;
  }).join('');
}

function buildPlatforms(data) {
  buildStatBars('platforms-list', data, 'platform', name => {
    const key = (name || '').toLowerCase();
    return PLAT_ICON[key] || PLAT_ICON.default;
  });
}

function buildCountries(data) {
  buildStatBars('countries-list', data?.slice(0, 5), 'country', name => FLAG[name] || '🌐');
}

// ── Rows ──
function renderRows(rows) {
  const esc = s => String(s ?? '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el('log-body').innerHTML = rows.map(r => {
    const bc = r.status === 'success' ? 'ok' : r.status === 'error' ? 'err' : 'pnd';
    const loc = [r.city, r.country].filter(Boolean).join(', ') || '—';
    const ts  = (r.timestamp ?? '').replace('T',' ').slice(0,16);
    const row = JSON.stringify(r).replace(/'/g,"&#39;");
    return `<tr data-row='${row}'>
      <td class="c-id">${r.id}</td>
      <td class="c-ts">${esc(ts)}</td>
      <td class="c-status"><span class="badge ${bc}">${esc(r.status)}</span></td>
      <td class="c-plat">${esc(r.platform)}</td>
      <td class="c-loc">${esc(loc)}</td>
      <td class="c-fmt">${esc(r.format)}${r.quality ? ' · '+esc(r.quality) : ''}</td>
      <td class="c-dev">${esc(r.device)}</td>
      <td class="c-ip">${esc(r.ip_address)}</td>
      <td class="c-title"><span title="${esc(r.title)}">${esc(r.title) || '<span style="color:var(--text-3)">—</span>'}</span></td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-3)">No records found</td></tr>`;

  document.querySelectorAll('#log-body tr[data-row]').forEach(tr =>
    tr.addEventListener('click', () => openDrawer(JSON.parse(tr.dataset.row)))
  );
}

// ── Drawer ──
function openDrawer(r) {
  const esc = s => String(s ?? '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const bc = r.status === 'success' ? 'ok' : r.status === 'error' ? 'err' : 'pnd';

  let html = `
    <div class="dr-status"><span class="badge ${bc}">${esc(r.status)}</span></div>
    <div class="dr-heading">${esc(r.title) || '<span style="color:var(--text-3)">No title</span>'}</div>
  `;
  if (r.error_msg) html += `<div class="dr-error">${esc(r.error_msg)}</div>`;

  html += drGroup('Request', [
    ['ID',        r.id],
    ['Timestamp', r.timestamp],
    ['IP',        r.ip_address],
    ['Country',   r.country],
    ['City',      r.city],
    ['Device',    r.device],
  ]);
  html += drGroup('Download', [
    ['Platform', r.platform],
    ['Format',   r.format],
    ['Quality',  r.quality],
  ]);

  el('drawer-body').innerHTML = html;
  el('overlay').classList.add('on');
  el('drawer').classList.add('on');
}

function drGroup(label, pairs) {
  const esc = s => String(s ?? '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rows = pairs.map(([k,v]) => `
    <div class="dr-row">
      <span class="dr-key">${k}</span>
      <span class="dr-val">${esc(v) || '<span style="color:var(--text-3)">—</span>'}</span>
    </div>`).join('');
  return `<div class="dr-group"><div class="dr-group-label">${label}</div>${rows}</div>`;
}

function closeDrawer() {
  el('overlay').classList.remove('on');
  el('drawer').classList.remove('on');
}

el('drawer-close').addEventListener('click', closeDrawer);
el('overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer() });
</script>
</body>
</html>
