<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Preview</title>
<script>
const themes = {
  amber: {
    '--bg': '#111008', '--surface': '#181408', '--border': '#35301f',
    '--border-mid': '#4a422c', '--border-hi': '#6e5c35',
    '--amber-dim': '#5a4e32', '--amber-low': '#9c8450', '--amber-mid': '#c0a060',
    '--amber': '#ddb96a', '--amber-hi': '#f0d07a', '--amber-bright': '#fae48a',
    '--amber-glow': '#f5cc60', '--text': '#dbb870',
  },
  cyan: {
    '--bg': '#060d0f', '--surface': '#091215', '--border': '#0e2a30',
    '--border-mid': '#164050', '--border-hi': '#1e6070',
    '--amber-dim': '#0e3040', '--amber-low': '#2a7a8a', '--amber-mid': '#3aa0b0',
    '--amber': '#50c8d8', '--amber-hi': '#70e0ee', '--amber-bright': '#90f0fa',
    '--amber-glow': '#50d8e8', '--text': '#60d0e0',
  },
  green: {
    '--bg': '#060d06', '--surface': '#081208', '--border': '#0e2a0e',
    '--border-mid': '#164016', '--border-hi': '#206020',
    '--amber-dim': '#0e3010', '--amber-low': '#2a7a2a', '--amber-mid': '#40a040',
    '--amber': '#58c858', '--amber-hi': '#70e070', '--amber-bright': '#88f088',
    '--amber-glow': '#50d050', '--text': '#60d060',
  },
  violet: {
    '--bg': '#0a080f', '--surface': '#100c18', '--border': '#241a38',
    '--border-mid': '#362850', '--border-hi': '#503878',
    '--amber-dim': '#281840', '--amber-low': '#6040a0', '--amber-mid': '#8860c8',
    '--amber': '#aa88e0', '--amber-hi': '#ccaaff', '--amber-bright': '#ddc0ff',
    '--amber-glow': '#b090f0', '--text': '#bba0ee',
  },
};

const name = new URLSearchParams(location.search).get('theme') || 'amber';
const t = themes[name] || themes.amber;
document.addEventListener('DOMContentLoaded', () => {
  const root = document.documentElement;
  Object.entries(t).forEach(([k, v]) => root.style.setProperty(k, v));
  // show download panel
  const dp = document.getElementById('download-panel');
  if (dp) dp.style.display = 'block';
});
</script>
</head>
<body>
<script>
// Load the real index.html content via fetch and inject it
(async () => {
  const res = await fetch('index.html');
  const html = await res.text();
  // Extract just the body content
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Copy styles
  doc.querySelectorAll('style').forEach(s => {
    document.head.appendChild(document.adoptNode(s));
  });

  // Copy body
  document.body.innerHTML = doc.body.innerHTML;

  // Apply theme vars
  const name = new URLSearchParams(location.search).get('theme') || 'amber';
  const themes = {
    amber: {'--bg':'#111008','--surface':'#181408','--border':'#35301f','--border-mid':'#4a422c','--border-hi':'#6e5c35','--amber-dim':'#5a4e32','--amber-low':'#9c8450','--amber-mid':'#c0a060','--amber':'#ddb96a','--amber-hi':'#f0d07a','--amber-bright':'#fae48a','--amber-glow':'#f5cc60','--text':'#dbb870'},
    cyan:  {'--bg':'#060d0f','--surface':'#091215','--border':'#0e2a30','--border-mid':'#164050','--border-hi':'#1e6070','--amber-dim':'#0e3040','--amber-low':'#2a7a8a','--amber-mid':'#3aa0b0','--amber':'#50c8d8','--amber-hi':'#70e0ee','--amber-bright':'#90f0fa','--amber-glow':'#50d8e8','--text':'#60d0e0'},
    green: {'--bg':'#060d06','--surface':'#081208','--border':'#0e2a0e','--border-mid':'#164016','--border-hi':'#206020','--amber-dim':'#0e3010','--amber-low':'#2a7a2a','--amber-mid':'#40a040','--amber':'#58c858','--amber-hi':'#70e070','--amber-bright':'#88f088','--amber-glow':'#50d050','--text':'#60d060'},
    violet:{'--bg':'#0a080f','--surface':'#100c18','--border':'#241a38','--border-mid':'#362850','--border-hi':'#503878','--amber-dim':'#281840','--amber-low':'#6040a0','--amber-mid':'#8860c8','--amber':'#aa88e0','--amber-hi':'#ccaaff','--amber-bright':'#ddc0ff','--amber-glow':'#b090f0','--text':'#bba0ee'},
  };
  const t = themes[name] || themes.amber;
  Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));

  // show download panel
  const dp = document.getElementById('download-panel');
  if (dp) dp.style.display = 'block';
})();
</script>
</body>
</html>
