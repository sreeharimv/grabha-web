<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grabha — Theme Preview</title>
<style>
  body { margin: 0; background: #111; font-family: monospace; color: #ccc; }
  h1 { text-align: center; padding: 20px 0 10px; font-size: 16px; letter-spacing: 0.2em; color: #888; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; padding: 24px; }
  .theme-wrap { display: flex; flex-direction: column; gap: 8px; }
  .theme-label { font-size: 11px; letter-spacing: 0.15em; text-align: center; color: #666; text-transform: uppercase; }
  iframe { width: 100%; height: 520px; border: 1px solid #333; border-radius: 4px; }
</style>
</head>
<body>
<h1>— theme comparison —</h1>
<div class="grid">
  <div class="theme-wrap">
    <div class="theme-label">A — Amber (current)</div>
    <iframe id="f-a" src="theme-preview.html?theme=amber"></iframe>
  </div>
  <div class="theme-wrap">
    <div class="theme-label">B — Cyan Terminal</div>
    <iframe id="f-b" src="theme-preview.html?theme=cyan"></iframe>
  </div>
  <div class="theme-wrap">
    <div class="theme-label">C — Green Phosphor</div>
    <iframe id="f-c" src="theme-preview.html?theme=green"></iframe>
  </div>
  <div class="theme-wrap">
    <div class="theme-label">D — Violet Noir</div>
    <iframe id="f-d" src="theme-preview.html?theme=violet"></iframe>
  </div>
</div>
</body>
</html>
